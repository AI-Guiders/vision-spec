<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VisionSpec Player</title>
  <link rel="stylesheet" href="./sketch.css" />
  <link rel="stylesheet" href="../node_modules/@vscode/codicons/dist/codicon.css" />
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <strong>VisionSpec</strong>
      <span id="vision-title" class="muted">sketch player v0</span>
    </div>
    <div class="toolbar-actions">
      <select id="view-mode" aria-label="View mode">
        <option value="sketch">Sketch</option>
        <option value="graph">Transition graph</option>
      </select>
      <select id="example-select" aria-label="Example">
        <option value="examples/dashspec-studio.visionproj">dashspec-studio</option>
        <option value="examples/minimal.vision">minimal</option>
      </select>
      <label class="file-btn">
        Open .vision
        <input type="file" id="file-input" accept=".vision,.txt,text/plain" hidden />
      </label>
      <button type="button" class="file-btn" id="project-open-btn">Open project</button>
      <input type="file" id="project-dir-input" webkitdirectory multiple hidden />
    </div>
    <p id="project-hint" class="project-hint muted">Open project: choose the folder with <code>.visionproj</code> (e.g. <code>examples</code>) and confirm. Built-in demo: dropdown above.</p>
  </header>

  <main id="stage" class="stage" tabindex="0" aria-label="Sketch stage"><p class="muted boot-status">Loading dashspec-studio…</p></main>
  <div id="overlay-root" class="overlay-root hidden" aria-hidden="true"></div>

  <footer class="log">
    <div class="log-label">Transition log</div>
    <ul id="log-list"></ul>
  </footer>

  <script src="../node_modules/svg-pan-zoom/dist/svg-pan-zoom.min.js"></script>
  
  <script>
    (function () {
      var titleEl = document.getElementById("vision-title");
      var stage = document.getElementById("stage");
      function showErr(msg) {
        if (titleEl) titleEl.textContent = "Load failed";
        if (stage) stage.innerHTML = '<p class="load-error">' + msg + "</p>";
      }
      if (window.__VISION_INITIAL_DOC__) {
        var doc = window.__VISION_INITIAL_DOC__;
        if (titleEl) titleEl.textContent = doc.title || doc.id;
        window.__VISION_BOOT__ = Promise.resolve(doc);
        return;
      }
      window.__VISION_BOOT__ = (async function () {
        try {
          var ctrl = new AbortController();
          var timer = setTimeout(function () { ctrl.abort(); }, 15000);
          var resp = await fetch("/__vision/project", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ path: "examples/dashspec-studio.visionproj" }),
            signal: ctrl.signal,
          });
          clearTimeout(timer);
          if (!resp.ok) throw new Error(await resp.text());
          var doc = await resp.json();
          window.__VISION_INITIAL_DOC__ = doc;
          if (titleEl) titleEl.textContent = doc.title || doc.id;
          return doc;
        } catch (err) {
          showErr(String(err && err.message ? err.message : err));
          throw err;
        }
      })();
      window.addEventListener("error", function (ev) {
        if (window.__VISION_INITIAL_DOC__) return;
        showErr("Player script error: " + String(ev.message || ev.error || "unknown"));
      });
    })();
  </script>
  <script type="module" src="./runtime.js?v=boot5"></script>
</body>
</html>
